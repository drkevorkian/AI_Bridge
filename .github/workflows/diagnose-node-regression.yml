name: Diagnose Node regression

on:
  push:
    branches:
      - "ai-b/v1.17.1-source-fold"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'drkevorkian/AI_Bridge' && github.ref == 'refs/heads/ai-b/v1.17.1-source-fold'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ai-b/v1.17.1-source-fold
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Capture regression output
        id: regression
        shell: bash
        run: |
          set +e
          node tests/run-all.mjs > node-regression-diagnostic.txt 2>&1
          status=$?
          cat node-regression-diagnostic.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-regression-diagnostic
          path: node-regression-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failure status
        shell: bash
        run: exit "${{ steps.regression.outputs.status }}"
