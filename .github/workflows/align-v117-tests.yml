name: Align v1.17 regression architecture

on:
  push:
    branches:
      - "ai-b/v1.17.1-source-fold"

permissions:
  contents: read

jobs:
  align-tests:
    if: github.repository == 'drkevorkian/AI_Bridge' && github.ref == 'refs/heads/ai-b/v1.17.1-source-fold'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ai-b/v1.17.1-source-fold
          fetch-depth: 0
      - name: Align stale regression assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/align-v117-tests.py
          node --check tests/v1.16-oauth-callback-hotfix.mjs
          node --check tests/v1.16-oauth-power.mjs
          node --check tests/v1.16.3-completion.mjs
          node --check tests/v1.16.3-human-input-hardening.mjs
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 4
          for file in "${changed[@]}"; do
            case "$file" in
              tests/v1.16-oauth-callback-hotfix.mjs|tests/v1.16-oauth-power.mjs|tests/v1.16.3-completion.mjs|tests/v1.16.3-human-input-hardening.mjs) ;;
              *) echo "Unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v1.16-oauth-callback-hotfix.mjs tests/v1.16-oauth-power.mjs tests/v1.16.3-completion.mjs tests/v1.16.3-human-input-hardening.mjs
          git commit -m "tests: align regressions with v1.17 bootstrap stack"
          git push origin HEAD:ai-b/v1.17.1-source-fold
