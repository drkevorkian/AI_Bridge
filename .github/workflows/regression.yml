name: AI Bridge regression

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "ai-a/**"
      - "ai-b/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Node regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          check-latest: true
      - name: Show runtime
        run: node --version
      - name: Syntax and regression suite
        run: node tests/run-all.mjs

  chromium-mv3:
    name: Chromium MV3 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CFT_VERSION: "153.0.8010.36"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          check-latest: true
      - name: Install pinned Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          CFT_ROOT="$RUNNER_TEMP/chrome-for-testing"
          mkdir -p "$CFT_ROOT"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$CFT_ROOT/chrome-linux64.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
          unzip -q "$CFT_ROOT/chrome-linux64.zip" -d "$CFT_ROOT"
          chmod +x "$CFT_ROOT/chrome-linux64/chrome"
          echo "CHROME_BIN=$CFT_ROOT/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Verify browser runtime
        shell: bash
        run: |
          "$CHROME_BIN" --version
          openssl version
          xvfb-run --help >/dev/null
      - name: Load unpacked MV3 extension and exercise provider messaging
        run: xvfb-run -a node tests/chromium-mv3-smoke.mjs
