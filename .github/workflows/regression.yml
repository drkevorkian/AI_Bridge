name: AI Bridge regression

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "ai-a/**"
      - "ai-b/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Node regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          check-latest: true
      - name: Show runtime
        run: node --version
      - name: Syntax and regression suite
        run: node tests/run-all.mjs

  chromium-mv3:
    name: Chromium MV3 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          check-latest: true
      - name: Verify browser runtime
        run: |
          google-chrome --version
          openssl version
      - name: Load unpacked MV3 extension and exercise provider messaging
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/chromium-mv3-smoke.mjs
