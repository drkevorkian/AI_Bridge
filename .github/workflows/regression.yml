name: AI Bridge regression

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "ai-a/**"
      - "ai-b/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Static MV3 regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          check-latest: true
      - name: Show runtime
        run: node --version
      - name: JavaScript syntax
        run: |
          node --check background.js
          node --check dom-resilience.js
          node --check content.js
          node --check dashboard.js
          node --check dashboard-layouts.js
          node --check settings.js
          node --check popup.js
          node --check tests/repository-integrity.mjs
          node --check tests/ui-radius-policy.mjs
          node --check tests/dom-resilience.mjs
          node --check tests/provider-send-authority.mjs
          node --check tests/provider-event-awareness.mjs
      - name: Repository integrity
        run: node tests/repository-integrity.mjs
      - name: Three-column relay hardening
        run: node tests/v1.18.1-three-column-relay-hardening.mjs
      - name: UI radius policy
        run: node tests/ui-radius-policy.mjs
      - name: DOM resilience contracts
        run: node tests/dom-resilience.mjs
      - name: Provider send authority
        run: node tests/provider-send-authority.mjs
      - name: Provider operational events
        run: node tests/provider-event-awareness.mjs
