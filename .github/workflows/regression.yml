name: AI Bridge regression

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "ai-a/**"
      - "ai-b/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Node regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: "22"
          check-latest: true
      - name: Show runtime
        run: node --version
      - name: Syntax and regression suite
        run: node tests/run-all.mjs
