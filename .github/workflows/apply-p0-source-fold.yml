name: Apply reviewed P0 source fold

on:
  push:
    branches:
      - "ai-b/v1.17.1-source-fold"

permissions:
  contents: read

jobs:
  apply-reviewed-patch:
    if: github.repository == 'drkevorkian/AI_Bridge' && github.ref == 'refs/heads/ai-b/v1.17.1-source-fold'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ai-b/v1.17.1-source-fold
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Finalize background source hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/finalize-p0-source.py
          node --check background.js
          git diff --check
          changed="$(git diff --name-only | tr -d '\r')"
          if [ -z "$changed" ]; then
            exit 0
          fi
          test "$changed" = "background.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.js
          git commit -m "security: make source artifact allowlist self-contained"
          git push origin HEAD:ai-b/v1.17.1-source-fold
