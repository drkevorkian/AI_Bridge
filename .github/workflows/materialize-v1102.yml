name: Materialize AI Bridge v1.10.2 source

on:
  push:
    branches:
      - ai-a/v1.10.2-publish

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-a/v1.10.2-publish
      - name: Rebuild and verify exact v1.10.2 release
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/v1102/payload.b64.* | tr -d '\n' | base64 -d > /tmp/v1102.tar.xz
          echo 'd023650644bd62323fc1c03e8a97f842ae92e79ffae01437f1ee18c044b4df5a  /tmp/v1102.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v1102.tar.xz -C .
          rm -rf .publish
          rm -f .github/workflows/materialize-v1102.yml
          rmdir .github/workflows .github 2>/dev/null || true
          node --check background.js
          node --check content.js
          node --check dashboard.js
          node --check popup.js
          python -m json.tool manifest.json >/dev/null
          test "$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')" = '1.10.2'
          grep -q 'CONTENT_VERSION = "1.10.2"' background.js
          grep -q 'AI_BRIDGE_HUMAN_SUPPRESS' background.js
          grep -q 'Suppress request' dashboard.html
          grep -q 'Stop session' dashboard.html
          grep -qi -- '--theme-bg: #ace5ee' dashboard.css
          grep -qi -- '--bg: #ace5ee' dashboard.css
          grep -qi -- '--text: #0a3a44' dashboard.css
          cat > /tmp/release.sha256 <<'EOF'
          a162d8bb1b0bb035e5c4eea97948ff8e29f57bc32f777111bd04dec2ec092a35  README.md
          100cec63bf99be9b15229a8b15fbee48a0c9149615c5e3132a51ffe2dfab52ec  background.js
          d5372128d33acf830e7b65d9e56b06036ec0a236f40c687b96080840fc54235b  content.js
          2232c9216f9b5bc0bfc491d436cf8f8f88f80c2f682d55b6d76b0f2c567adcef  dashboard.css
          bb0c7eae9ca5a48b4d698c2c15c0e046f6468a12258b2fda3c2c31596ee9f4cf  dashboard.html
          fdd708a593ca2684bc917f1033dacd101d5a8165e8341c71edee45370900fd0a  dashboard.js
          0d050875f7ae263bce9f6fc07009a8fec434a53308372817452e4e16d17f9e7b  icon128.png
          5fa1803b97d828f10f34e387bb6ac2a845e269b6ec80ee45cb5c510ca4122dcb  manifest.json
          c40638ae18cfeefca797dc6370f2a58cbb2537a4ba1ba047b5e23c57447f3ae5  popup.css
          3050b9bc54822742f1cb616b62a4f178715d8f02322950cf87d966e8e7d08811  popup.html
          98eeaa834583712039a69404a4b4b3493e6084268b81b397d7b7b18303edaece  popup.js
          EOF
          sha256sum -c /tmp/release.sha256
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 11
      - name: Commit verified v1.10.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Bridge Release Bot'
          git config user.email 'noreply@github.com'
          git add -A
          git commit -m 'Release AI Bridge v1.10.2 complete source'
          git push origin HEAD:ai-a/v1.10.2-publish
