name: Materialize AI Bridge v1.11 review source
on:
  push:
    branches:
      - ai-a/v1.11-direct-mesh
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-v111]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-a/v1.11-direct-mesh
      - name: Rebuild and verify exact v1.11 candidate
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n' < .publish/v111/payload.b64 | base64 -d > /tmp/v111.tar.xz
          echo 'f91d2f07d98e70ba84ef231d88740b8049288ffda1b25629391166dd25347d5b  /tmp/v111.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v111.tar.xz -C .
          rm -rf .publish
          rm -f .github/workflows/materialize-v111.yml
          rmdir .github/workflows .github 2>/dev/null || true
          node --check background.js
          node --check content.js
          node --check dashboard.js
          node --check popup.js
          python -m json.tool manifest.json >/dev/null
          test "$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')" = '1.11.0'
          grep -q 'CONTENT_VERSION = "1.11.0"' background.js
          grep -q 'version: "1.11.0"' content.js
          grep -q 'AI_BRIDGE_HUMAN_REOPEN' background.js
          grep -q 'SEND TO' background.js
          grep -q 'value="mesh"' dashboard.html
          grep -q 'suppressedRequests' dashboard.html
          cat > /tmp/release.sha256 <<'EOF'
          02cef79a10df677796273cac05b95972dba51cce7b06ddc9246e440c486e298f  README.md
          6c6f2d017c74a5bca8ddd32bf00f3d6f72b58f46040b6de51bd72234f2ecc71a  background.js
          ca48b962ff35ab22a848191652f73cc6f4f69b5806ae69d994d20ae0e3e5b32e  content.js
          81b8263368c1185ae7329497dfd3a4c0dcd0472d24de4b0e625bf659c84d5d7a  dashboard.css
          928ff0cbee82e9b4c2afcdb7f4b8d6be809339d1b96764ac09e03f5cac654365  dashboard.html
          2010e3e98a08b92a40e107e889cf553ecafff980efbcf30f4225a319047f7a57  dashboard.js
          0d050875f7ae263bce9f6fc07009a8fec434a53308372817452e4e16d17f9e7b  icon128.png
          6fce361260bb77b9cd439e758c40b5a1635ae7c997af0a8479da31a25c01525e  manifest.json
          c40638ae18cfeefca797dc6370f2a58cbb2537a4ba1ba047b5e23c57447f3ae5  popup.css
          3050b9bc54822742f1cb616b62a4f178715d8f02322950cf87d966e8e7d08811  popup.html
          98eeaa834583712039a69404a4b4b3493e6084268b81b397d7b7b18303edaece  popup.js
          EOF
          sha256sum -c /tmp/release.sha256
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 11
      - name: Commit verified v1.11 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name drkevorkian
          git config user.email sirus.softs@gmail.com
          git add -A
          git commit -m 'AI Bridge v1.11 Direct Mesh review source [materialized-v111]'
          git push origin HEAD:ai-a/v1.11-direct-mesh
