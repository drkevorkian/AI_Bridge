name: Materialize AI Bridge v1.11 review source
on:
  push:
    branches: [ai-a/v1.11-direct-mesh]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-v111]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-a/v1.11-direct-mesh
      - name: Rebuild and verify exact v1.11 candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/v111/payload.b64.part-* | tr -d '\n' | base64 -d > /tmp/v111.tar.xz
          echo 'f91d2f07d98e70ba84ef231d88740b8049288ffda1b25629391166dd25347d5b  /tmp/v111.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v111.tar.xz -C .
          rm -rf .publish
          rm -f .github/workflows/materialize-v111.yml
          rmdir .github/workflows .github 2>/dev/null || true
          node --check background.js
          node --check content.js
          node --check dashboard.js
          node --check popup.js
          python -m json.tool manifest.json >/dev/null
          test "$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')" = '1.11.0'
          grep -q 'CONTENT_VERSION = "1.11.0"' background.js
          grep -q 'version: "1.11.0"' content.js
          grep -q 'AI_BRIDGE_HUMAN_REOPEN' background.js
          grep -q 'SEND TO' background.js
          grep -q 'value="mesh"' dashboard.html
          grep -q 'suppressedRequests' dashboard.html
          sha256sum README.md background.js content.js dashboard.css dashboard.html dashboard.js icon128.png manifest.json popup.css popup.html popup.js
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 11
      - name: Commit verified v1.11 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name drkevorkian
          git config user.email sirus.softs@gmail.com
          git add -A
          git commit -m 'AI Bridge v1.11 Direct Mesh review source [materialized-v111]'
          git push origin HEAD:ai-a/v1.11-direct-mesh
