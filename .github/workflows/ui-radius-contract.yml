name: UI Radius Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ui-radius-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Enforce UI radius contract
        run: python tests/ui_radius_contract.py
