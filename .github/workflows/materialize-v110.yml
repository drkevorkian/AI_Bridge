name: Materialize AI Bridge v1.10 source

on:
  push:
    branches:
      - ai-a/v1.10-full-source-publish
    paths:
      - '.github/workflows/materialize-v110.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-a/v1.10-full-source-publish
      - name: Rebuild exact v1.10 runtime sources
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/v110/payload.tar.xz.b64.* | tr -d '\n' | base64 -d > /tmp/v110.tar.xz
          tar -xJf /tmp/v110.tar.xz -C .
          rm -rf .publish
          rm -f .github/workflows/materialize-v110.yml
          node --check background.js
          node --check content.js
          node --check dashboard.js
          node --check popup.js
          python -m json.tool manifest.json >/dev/null
          test "$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')" = "1.10.0"
          grep -q 'CONTENT_VERSION = "1.10.0"' background.js
          grep -q '__AI_BRIDGE_LOADED_V110__' content.js
          grep -qi '#ace5ee' dashboard.css
          grep -q 'grid-template-columns: 40% 60%' dashboard.css
      - name: Commit materialized v1.10 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize complete AI Bridge v1.10 source'
          git push origin HEAD:ai-a/v1.10-full-source-publish
