name: Apply final regression drift fixes

on:
  push:
    branches:
      - "ai-b/v1.17.1-source-fold"

permissions:
  contents: read

jobs:
  apply-tests:
    if: github.repository == 'drkevorkian/AI_Bridge' && github.ref == 'refs/heads/ai-b/v1.17.1-source-fold'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ai-b/v1.17.1-source-fold
          fetch-depth: 0
      - name: Apply validated regression corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-final-test-drift.py
          node tests/run-all.mjs
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 4
          for file in "${changed[@]}"; do
            case "$file" in
              tests/v1.13-security.mjs|tests/v1.15-settings.mjs|tests/v1.16.3-reconnect-hardening.mjs|tests/v1.17-security-ui.mjs) ;;
              *) echo "Unexpected changed file: $file" >&2; exit 1 ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v1.13-security.mjs tests/v1.15-settings.mjs tests/v1.16.3-reconnect-hardening.mjs tests/v1.17-security-ui.mjs
          git commit -m "tests: align final regressions with v1.17 security architecture"
          git push origin HEAD:ai-b/v1.17.1-source-fold
